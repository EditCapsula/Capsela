name: Générer les visuels de l'écran Style (admin)

# Déclenchement manuel uniquement ("Run workflow" depuis l'onglet Actions) —
# jamais automatique, pour ne jamais consommer de crédit OpenAI sans action
# explicite. Indépendant du pipeline catalogue (generate-catalog-image) —
# appelle l'API OpenAI Images directement, cf. en-tête de
# scripts/generate-style-visuals.mjs.
#
# Flux en 2 temps :
#   1. mode "generate" : génère N candidats par visuel (3 par défaut,
#      réglable via l'input "candidates" — 1 suffit en phase d'itération sur
#      le wording des prompts), uploadés dans
#      catalog-images/style-visuals/_staging/ (public, ouvrable directement
#      au navigateur — pas de zip à télécharger).
#   2. mode "promote" : une fois un candidat choisi visuellement, le
#      convertit en .webp et le copie vers le chemin définitif
#      catalog-images/style-visuals/{genre}/{style}.webp.
#
# Nécessite deux secrets de dépôt (Settings → Secrets and variables →
# Actions) : SB_SECRET_KEY (la clé sb_secret_... du projet, également
# utilisée par les autres workflows d'images depuis la désactivation des
# clés JWT le 28/08/2026) et OPENAI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generate (candidats) ou promote (chemin définitif)"
        required: true
        type: choice
        options:
          - generate
          - promote
        default: generate
      all:
        description: "Mode generate uniquement : générer les 14 visuels d'un coup"
        required: false
        type: boolean
        default: false
      gender:
        description: "femme ou homme (ignoré si 'all' est coché)"
        required: false
        type: choice
        options:
          - femme
          - homme
      style:
        description: 'Id(s) du style — un seul ("casual_chic") ou plusieurs séparés par des virgules ("minimaliste,classique_chic,romantique"). Ignoré si "all" est coché ou en mode promote (un seul id).'
        required: false
        type: string
      candidate:
        description: 'Mode promote uniquement, un seul style : numéro du candidat retenu (ignoré si "items" est rempli)'
        required: false
        type: string
      items:
        description: "Mode promote uniquement, plusieurs styles d'un coup — style:candidat,style:candidat,... ex. minimaliste:1,classique_chic:1,romantique:2"
        required: false
        type: string
      candidates:
        description: "Mode generate uniquement : nombre de candidats par visuel (1 à 5, défaut 3 — 1 suffit en phase d'itération sur le wording)"
        required: false
        type: string
        default: "3"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Génération
        if: ${{ inputs.mode == 'generate' && inputs.all }}
        run: node scripts/generate-style-visuals.mjs --mode=generate --all --candidates=${{ inputs.candidates }}
        env:
          SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Génération (un ou plusieurs visuels)
        if: ${{ inputs.mode == 'generate' && !inputs.all }}
        run: node scripts/generate-style-visuals.mjs --mode=generate --gender=${{ inputs.gender }} --style=${{ inputs.style }} --candidates=${{ inputs.candidates }}
        env:
          SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Promotion (plusieurs styles)
        if: ${{ inputs.mode == 'promote' && inputs.items != '' }}
        run: node scripts/generate-style-visuals.mjs --mode=promote --gender=${{ inputs.gender }} --items=${{ inputs.items }}
        env:
          SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      - name: Promotion (un style)
        if: ${{ inputs.mode == 'promote' && inputs.items == '' }}
        run: node scripts/generate-style-visuals.mjs --mode=promote --gender=${{ inputs.gender }} --style=${{ inputs.style }} --candidate=${{ inputs.candidate }}
        env:
          SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
