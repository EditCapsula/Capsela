name: Recompresser les visuels PNG hérités

# Enchaîne les appels à la fonction Edge recompress-legacy-images jusqu'à
# épuisement du stock de PNG. Un appel ne peut traiter que 2 à 3 images — le
# décodage/redimensionnement/encodage WASM sature le budget CPU d'une
# invocation Edge au-delà — donc vider 357 images demande ~180 appels. Ce
# workflow les fait à ta place.
#
# PRÉREQUIS — deux secrets de dépôt (Settings > Secrets and variables > Actions) :
#   RECOMPRESS_ADMIN_KEY      la chaîne choisie pour le secret du même nom
#                             côté Supabase (Edge Functions > Secrets)
#   SUPABASE_PUBLISHABLE_KEY  la clé sb_publishable_... du projet. Elle n'est
#                             pas confidentielle (le navigateur l'expose déjà),
#                             mais Supabase exige un jeton valide en en-tête
#                             avant même d'exécuter la fonction : c'est ce
#                             laissez-passer, pas l'autorisation d'agir, que
#                             RECOMPRESS_ADMIN_KEY porte dans le corps.
#
# Reprise : la fonction est idempotente et n'écrit qu'après conversion réussie.
# Une exécution interrompue peut être relancée telle quelle, elle repartira
# des images encore en .png.

on:
  workflow_dispatch:
    inputs:
      lot:
        description: "Images par appel (3 sature la limite CPU, 2 laisse une marge)"
        default: "2"
      max_appels:
        description: "Nombre maximum d'appels avant de rendre la main"
        default: "250"

jobs:
  recompresser:
    runs-on: ubuntu-latest
    steps:
      - name: Enchaîner les appels jusqu'à épuisement
        env:
          ADMIN_KEY: ${{ secrets.RECOMPRESS_ADMIN_KEY }}
          PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LOT: ${{ inputs.lot }}
          MAX_APPELS: ${{ inputs.max_appels }}
        run: |
          set -uo pipefail
          URL="https://tkrbzrazejrxavtfspll.supabase.co/functions/v1/recompress-legacy-images"

          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::secret RECOMPRESS_ADMIN_KEY absent"; exit 1
          fi
          if [ -z "$PUBLISHABLE_KEY" ]; then
            echo "::error::secret SUPABASE_PUBLISHABLE_KEY absent"; exit 1
          fi

          convertis_total=0
          avant_total=0
          apres_total=0
          echecs_total=0
          enjambees=0
          # Curseur : la fonction ne considère que les assets d'id supérieur.
          # Il n'avance que sur les lots effectivement tentés, donc une
          # exécution interrompue peut toujours repartir de zéro sans rien
          # retraiter — les images déjà converties ne sont plus en .png.
          curseur=0
          # Une saturation CPU ne veut pas dire la même chose selon la taille
          # du lot (relevé du 28/08/2026) : à 2, c'est le plus souvent la
          # somme de deux images ; à 1, c'est cette image-là qui est
          # intraitable. D'où la dégressivité — réessayer à l'identique, comme
          # le faisait la version précédente, ne pouvait qu'échouer à nouveau.
          lot_courant="$LOT"
          # Une réponse vide ou illisible est un aléa de transport, pas un
          # verdict : le run du 28/08/2026 a converti 92 images puis s'est
          # arrêté sur un unique appel revenu vide, laissant 265 images en
          # plan. On réessaie donc avant d'abandonner.
          illisibles=0

          for appel in $(seq 1 "$MAX_APPELS"); do
            reponse=$(curl -sS --max-time 120 -X POST "$URL" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"admin_key\": \"$ADMIN_KEY\", \"limit\": $lot_courant, \"apres_id\": $curseur}") || reponse=""

            if echo "$reponse" | jq -e '.code == "WORKER_RESOURCE_LIMIT"' >/dev/null 2>&1; then
              if [ "$lot_courant" -gt 1 ]; then
                lot_courant=$((lot_courant / 2))
                echo "appel $appel · limite CPU atteinte — nouvelle tentative avec un lot de $lot_courant"
                sleep 5
                continue
              fi
              # Lot de 1 saturé : cette image est intraitable telle quelle. On
              # demande son id sans la traiter (dry_run ne calcule rien), on
              # l'enjambe, et on la signale pour un traitement séparé.
              bloquante=$(curl -sS --max-time 60 -X POST "$URL" \
                -H "apikey: $PUBLISHABLE_KEY" \
                -H "Authorization: Bearer $PUBLISHABLE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"admin_key\": \"$ADMIN_KEY\", \"limit\": 1, \"apres_id\": $curseur, \"dry_run\": true}") || bloquante=""
              id_bloquant=$(echo "$bloquante" | jq -r '.lot[0].id // empty')
              cle_bloquante=$(echo "$bloquante" | jq -r '.lot[0].visual_key // "?"')
              if [ -z "$id_bloquant" ]; then
                echo "::error::image intraitable, et son identification a échoué — arrêt"
                echo "$bloquante"
                exit 1
              fi
              echo "::warning::image $id_bloquant ($cle_bloquante) intraitable — enjambée, à recompresser séparément"
              enjambees=$((enjambees + 1))
              curseur="$id_bloquant"
              lot_courant="$LOT"
              sleep 2
              continue
            fi
            lot_courant="$LOT"

            if ! echo "$reponse" | jq -e 'has("restants")' >/dev/null 2>&1; then
              illisibles=$((illisibles + 1))
              echo "appel $appel · réponse illisible ($illisibles/4) — nouvelle tentative"
              echo "  reçu : ${reponse:-<vide>}"
              if [ "$illisibles" -ge 4 ]; then
                echo "::error::quatre réponses illisibles d'affilée — la fonction ne répond plus correctement"
                exit 1
              fi
              sleep $((illisibles * 5))
              continue
            fi
            illisibles=0

            convertis=$(echo "$reponse" | jq -r '.convertis // 0')
            restants=$(echo "$reponse" | jq -r '.restants')
            a_traiter=$(echo "$reponse" | jq -r '.restants_a_traiter // 0')
            curseur=$(echo "$reponse" | jq -r '.dernier_id // 0')
            avant=$(echo "$reponse" | jq -r '.octets_avant // 0')
            apres=$(echo "$reponse" | jq -r '.octets_apres // 0')
            nb_echecs=$(echo "$reponse" | jq -r '.echecs | length')

            convertis_total=$((convertis_total + convertis))
            avant_total=$((avant_total + avant))
            apres_total=$((apres_total + apres))
            echecs_total=$((echecs_total + nb_echecs))

            echo "appel $appel · +$convertis converties · $restants restantes"

            if [ "$nb_echecs" -gt 0 ]; then
              echo "$reponse" | jq -c '.echecs[]' | while read -r e; do
                echo "::warning::échec — $e"
              done
            fi

            # C'est le reste APRÈS curseur qui commande l'arrêt : `restants`
            # inclut les images enjambées, qu'aucun appel ne reprendra.
            if [ "$a_traiter" -eq 0 ]; then
              echo "Plus rien à traiter après le curseur."
              break
            fi

            # Le curseur avançant sur chaque lot tenté, un appel sans
            # conversion ni échec ne peut plus faire boucler ; il reste
            # anormal et mérite d'être signalé.
            if [ "$convertis" -eq 0 ] && [ "$nb_echecs" -eq 0 ]; then
              echo "::warning::appel sans conversion ni échec — $reponse"
            fi

            sleep 1
          done

          {
            echo "### Recompression des visuels hérités"
            echo ""
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            echo "| Images converties | $convertis_total |"
            echo "| Images en échec | $echecs_total |"
            echo "| Images enjambées (intraitables) | $enjambees |"
            echo "| Restant en .png | ${restants:-inconnu} |"
            echo "| Poids avant | $((avant_total / 1024)) Ko |"
            echo "| Poids après | $((apres_total / 1024)) Ko |"
            if [ "$avant_total" -gt 0 ]; then
              echo "| Gain | $(( 100 - (apres_total * 100 / avant_total) )) % |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
