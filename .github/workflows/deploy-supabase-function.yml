name: Déployer les fonctions Supabase

# Permet de déployer les Edge Functions sans terminal local : ce workflow
# tourne sur les serveurs de GitHub. Se déclenche automatiquement quand le
# code d'une fonction change, ou manuellement depuis l'onglet Actions
# ("Run workflow" — nécessaire ici pour déployer analyze-dressing-photo une
# première fois, jamais poussée jusqu'ici, recette 24/08/2026). Nécessite un
# secret de dépôt GitHub SUPABASE_ACCESS_TOKEN (Settings → Secrets and
# variables → Actions), déjà configuré.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Déploie toutes les fonctions présentes dans supabase/functions,
      # plutôt qu'une liste à tenir à jour à la main (simplifié le
      # 26/08/2026). Cette liste avait déjà laissé analyze-dressing-photo
      # non déployée pendant des semaines, et weather a bien failli suivre
      # le même chemin.
      #
      # Les dossiers commençant par _ sont ignorés : _shared contient les
      # modules importés par les fonctions, ce n'en est pas une.
      #
      # bash s'arrête au premier échec (comportement par défaut des étapes
      # `run`), donc un déploiement raté fait échouer le workflow au lieu de
      # passer inaperçu.
      - name: Déployer toutes les fonctions
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in
              _*) echo "· $name ignoré (dossier partagé, pas une fonction)"; continue ;;
            esac
            echo "→ déploiement de $name"
            supabase functions deploy "$name" --project-ref tkrbzrazejrxavtfspll
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
