name: Générer toutes les images du catalogue (admin)

# Déclenchement manuel uniquement ("Run workflow" depuis l'onglet Actions) —
# jamais automatique, pour ne jamais lancer de génération sans action
# explicite. Balaie tout le catalogue (image_status 'missing'/'error'),
# appelle l'Edge Function generate-catalog-image pour chacun (qui applique
# elle-même déduplication, verrou et plafond quotidien). Nécessite le
# secret de dépôt SB_SECRET_KEY (clé sb_secret_...) (Settings → Secrets and
# variables → Actions) — jamais exposé côté client, lu uniquement ici côté
# serveur GitHub.

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/generate-all-catalog-images.mjs
        env:
          SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
