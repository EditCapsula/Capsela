name: Android — construire l'app pour Google Play

# Construit le fichier à envoyer à Google Play (.aab, signé avec la clé d'envoi), sans Android Studio (17/10/2026,
# docs/applications-mobiles.md). Lancer depuis l'onglet Actions → « Run workflow », avec le nom de version (« 1.0 », « 1.1 »…).
# Le numéro de version (versionCode, croissant, exigé par Google) est le numéro de cette exécution.
#
# Secrets : ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD (créés avec « Android — créer la clé d'envoi ») ;
# NEXT_PUBLIC_SUPABASE_ANON_KEY (la même clé publique que sur Vercel), sinon SUPABASE_PUBLISHABLE_KEY.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de version affiché (ex. 1.0)"
        required: true
        default: "1.0"
  # Sur une pull request qui touche au projet Android : la même construction, NON SIGNÉE, pour vérifier que l'app compile
  # (personne n'a Android Studio : c'est la seule compilation native du projet).
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-construire.yml"

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      # Le même site que sur le web, avec les adresses publiques de Supabase (elles sont dans le site livré, ce ne sont pas des secrets
      # au sens propre ; elles passent par les secrets pour ne pas être recopiées ici).
      - name: Construire le site et le copier dans le projet Android
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Clé publique Supabase absente : sans elle, l'app tournerait en mode démo."
            exit 1
          fi
          npm run build
          npx cap sync android

      - name: Préparer la clé d'envoi
        if: github.event_name == 'workflow_dispatch'
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : lance d'abord « Android — créer la clé d'envoi »."
            exit 1
          fi
          echo "$CLE" | base64 -d > "$RUNNER_TEMP/cle-envoi.jks"

      - name: Construire le fichier .aab signé
        working-directory: android
        env:
          CAPSELA_KEYSTORE_PATH: ${{ github.event_name == 'workflow_dispatch' && format('{0}/cle-envoi.jks', runner.temp) || '' }}
          CAPSELA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAPSELA_VERSION_CODE: ${{ github.run_number }}
          CAPSELA_VERSION_NAME: ${{ inputs.version || '0.0-verification' }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: capsela-${{ inputs.version }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
