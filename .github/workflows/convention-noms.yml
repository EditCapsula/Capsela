name: Audits catalogue — lecture seule (admin)

# Lecture seule, sans exception : exécute tous les audits catalogue
# (scripts/*.audit.ts) et ne génère AUCUN update. Les sorties sont déposées en
# artefacts du job, à relire avant toute écriture en base.
#
# Le fichier garde son nom d'origine : workflow_dispatch exige qu'un workflow
# existe sur la branche par défaut pour être déclenchable, et le renommer
# imposerait une fusion avant chaque nouvelle campagne d'audit.

on:
  workflow_dispatch:
    inputs:
      audit:
        description: "Audit à exécuter (vide = tous)"
        type: choice
        options: ["", "convention-noms", "taille-capsules", "images-perimees", "idees-par-piece", "coupe-backfill", "couverture-morpho", "morpho-look", "morpho-contre-audit", "morpho-arbitrage", "morpho-phase7", "morpho-phase8", "morpho-poire-entonnoir", "plafond-40", "contrefactuel-capsule", "morpho-substitution-optimisee", "morpho-regle-reelle", "morpho-phase10", "morpho-phase11", "morpho-phase12", "style-saison", "couverture-occasions", "formalite-palier4", "candidats-palier4", "simulation-retag", "anomalie-printemps", "exposition-temperature", "diversite-tenues", "palier4-apres-correctif", "residuel-apres-retag", "verification-retag", "ecart-891", "score-repli", "suggestions-mortes", "pull-contrat", "sous-type-reel", "pull-en-ete", "mailles-fermees"]
        default: ""

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Config dédiée : l'audit interroge Supabase, il est donc tenu hors de
      # `npm test`, qui doit rester hors-ligne (cf. vitest.audit.config.mts).
      # Un audit à la fois quand on le demande : les sorties sont volumineuses
      # et se noient l'une l'autre dans le log du job.
      - run: npx vitest run --config vitest.audit.config.mts ${{ inputs.audit }}
        env:
          SUPABASE_URL: https://tkrbzrazejrxavtfspll.supabase.co
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tableau-de-controle-noms
          path: |
            tableau-de-controle-noms.csv
            termes-sous-type.csv
            renommages-surs.sql
            coupe-backfill.csv
            couverture-morpho.csv
            morpho-looks.csv
            morpho-annotation-priorite.csv
            morpho-candidats.csv
          if-no-files-found: ignore
